{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveCast — Forgot Password</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg: #06060a; --surface: #0c0c16; --border: rgba(255,255,255,0.06);
            --text: #f0f0f8; --text-muted: #8a92a6; --input-bg: #0f0f1e;
        }
        :root[data-theme="light"] {
            --bg: #f4f5fa; --surface: #ffffff; --border: rgba(0,0,0,0.07);
            --text: #111625; --text-muted: #6b7280; --input-bg: #f9f9fb;
        }
        :root { --red: #ff3d5a; --red-glow: rgba(255,61,90,0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
                padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .icon-box { width: 60px; height: 60px; background: rgba(255,61,90,0.1); color: var(--red);
                    border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 20px auto; font-size: 28px; }
        .heading { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
                   margin-bottom: 10px; text-align: center; }
        .sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; text-align: center; }
        .role-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .role-tab { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 10px;
                    background: none; color: var(--text-muted); font-family: 'DM Sans', sans-serif;
                    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
        .role-tab.active { background: rgba(255,61,90,0.1); border-color: var(--red); color: var(--red); }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted);
                text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .input-wrap { position: relative; margin-bottom: 20px; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
                        font-size: 18px; color: var(--text-muted); }
        input[type="email"] { width: 100%; padding: 12px 14px 12px 42px; background: var(--input-bg);
                              border: 1px solid var(--border); border-radius: 10px; color: var(--text);
                              font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input[type="email"]:focus { border-color: var(--red); }
        .btn { display: block; width: 100%; padding: 14px; background: var(--red); color: #fff;
               border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 14px;
               font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn:hover { background: #e0304a; transform: translateY(-1px); box-shadow: 0 4px 20px var(--red-glow); }
        .alert { padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
                 display: flex; align-items: center; gap: 8px;
                 background: rgba(255,61,90,0.1); border: 1px solid rgba(255,61,90,0.25); color: #ff6b82; }
        .back-link { display: flex; align-items: center; justify-content: center; gap: 6px;
                     margin-top: 20px; font-size: 13px; color: var(--text-muted);
                     text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: var(--red); }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-box"><i class='bx bx-lock-alt'></i></div>
    <div class="heading">Forgot Password?</div>
    <p class="sub">Select your account type and enter your email to receive a reset link.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert"><i class='bx bx-error-circle'></i> {{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="role-tabs">
            <button type="button" class="role-tab {% if selected_role == 'owner' %}active{% endif %}"
                    onclick="setRole('owner')">Owner</button>
            <button type="button" class="role-tab {% if selected_role == 'staff' %}active{% endif %}"
                    onclick="setRole('staff')">Staff</button>
        </div>
        <input type="hidden" name="role" id="roleInput" value="{{ selected_role|default:'owner' }}">

        <label for="email">Email Address</label>
        <div class="input-wrap">
            <i class='bx bx-envelope'></i>
            <input type="email" id="email" name="email" value="{{ email|default:'' }}"
                   placeholder="Enter your email" required autofocus>
        </div>

        <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}" class="back-link"><i class='bx bx-arrow-back'></i> Return to Login</a>
</div>

<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('cc-theme') || 'dark');
    function setRole(role) {
        document.getElementById('roleInput').value = role;
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>
</body>
</html>
