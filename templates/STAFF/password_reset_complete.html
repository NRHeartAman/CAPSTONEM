{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveCast — Password Reset</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg: #06060a; --surface: #0c0c16; --border: rgba(255,255,255,0.06);
            --text: #f0f0f8; --text-muted: #8a92a6;
        }
        :root[data-theme="light"] {
            --bg: #f4f5fa; --surface: #ffffff; --border: rgba(0,0,0,0.07);
            --text: #111625; --text-muted: #6b7280;
        }
        :root { --red: #ff3d5a; --red-glow: rgba(255,61,90,0.3); --green: #00c873; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
                padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; }
        .icon-box { width: 60px; height: 60px; background: rgba(0,200,115,0.1); color: var(--green);
                    border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    margin: 0 auto 20px auto; font-size: 28px; }
        .heading { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
        .btn { display: block; width: 100%; padding: 14px; background: var(--red); color: #fff;
               border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 14px;
               font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; }
        .btn:hover { background: #e0304a; transform: translateY(-1px); box-shadow: 0 4px 20px var(--red-glow); }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-box"><i class='bx bx-check-circle'></i></div>
    <div class="heading">Password Reset</div>
    <p class="sub">Your password has been changed successfully. You can now sign in with your new password.</p>

    <a href="{% url 'login' %}" class="btn">Return to Login</a>
</div>

<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('cc-theme') || 'dark');
</script>
</body>
</html>
