{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Edit Employee</h1>
        <p>Update profile details for {{ emp.full_name|default:emp.username }}</p>
    </div>
    <a href="{% url 'view-employees' %}" class="btn btn-ghost">
        <i class='bx bx-arrow-back'></i> Back
    </a>
</div>

<div class="card" style="max-width: 560px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ emp.full_name|default:'' }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ emp.email|default:'' }}">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ profile.phone|default:'' }}">
        </div>
        <div class="form-group">
            <label>Address</label>
            <textarea name="address" rows="2">{{ profile.address|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Date Hired</label>
            <input type="date" name="date_hired" value="{{ profile.date_hired|date:'Y-m-d'|default:'' }}">
        </div>
        <div class="form-group">
            <label>Contract Type</label>
            <select name="contract_type">
                <option value="6months"  {% if profile.contract_type == '6months' %}selected{% endif %}>6 Months</option>
                <option value="1year"    {% if profile.contract_type == '1year'   %}selected{% endif %}>1 Year</option>
                <option value="2years"   {% if profile.contract_type == '2years'  %}selected{% endif %}>2 Years</option>
                <option value="regular"  {% if profile.contract_type == 'regular' %}selected{% endif %}>Regular</option>
            </select>
        </div>
        <div class="form-group">
            <label>Profile Photo</label>
            {% if profile.photo %}
                <img src="{{ profile.photo.url }}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:8px; display:block;">
            {% endif %}
            <input type="file" name="photo" accept="image/*">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <i class='bx bx-save'></i> Save Changes
            </button>
            <a href="{% url 'view-employees' %}" class="btn btn-ghost" style="flex: 1; justify-content: center;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
