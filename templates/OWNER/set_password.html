{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password — CraveCast</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

    <style>
    :root[data-theme="dark"] {
        --bg:            #0b0b13;
        --surface:       #13131f;
        --surface2:      #1a1a2b;
        --surface3:      #21213a;
        --border:        rgba(255,255,255,0.07);
        --text:          #f0f0f8;
        --text-muted:    #6b7280;
        --text-dim:      #4b5563;
    }
    :root {
        --red:           #ff3d5a;
        --red-dim:       rgba(255,61,90,0.12);
        --purple:        #8b5cf6;
        --purple-dim:    rgba(139,92,246,0.12);
        --amber:         #f59e0b;
        --blue:          #3b82f6;
        --green:         #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 40px; }
    .pw-eye {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer;
        color: var(--text-dim); font-size: 17px;
        display: flex; align-items: center; justify-content: center;
        padding: 2px; transition: color 0.2s;
    }
    .pw-eye:hover { color: var(--text-muted); }

    .strength-bar { height: 4px; border-radius: 2px; background: var(--surface3); margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 11px; margin-top: 5px; font-weight: 500; }

    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label {
        display: block; font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.7px;
        color: var(--text-muted); margin-bottom: 6px;
    }
    .form-input {
        width: 100%; padding: 10px 14px;
        border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface2); color: var(--text);
        font-family: 'DM Sans', sans-serif; font-size: 13px;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
    }
    .form-input:focus {
        outline: none;
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }

    .msg-banner {
        padding: 13px 18px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 10px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
    }
    .msg-error { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,61,90,0.25); }
    </style>
</head>
<body>

    <div style="
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 56px 48px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0,0,0,0.10);
        position: relative;
        overflow: hidden;
    ">

        <!-- Decorative background ring -->
        <div style="
            position: absolute;
            top: -60px; right: -60px;
            width: 200px; height: 200px;
            border-radius: 50%;
            opacity: 0.04;
            background: #8b5cf6;
        "></div>

        <!-- Logo -->
        <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom: 28px;">
            <img src="{% static 'images/logo.png' %}" alt="CraveCast Logo" style="width:32px; height:32px; object-fit:contain; filter: invert(1) brightness(2);">
            <div style="font-family:'Syne',sans-serif; font-weight:800; font-size:18px; letter-spacing:-0.3px;">
                Crave<span style="color:var(--red);">Cast</span>
            </div>
        </div>

        <div style="
            width: 80px; height: 80px;
            background: rgba(139,92,246,0.12);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            border: 2px solid rgba(139,92,246,0.25);
        ">
            <i class='bx bx-key' style="font-size: 44px; color: #8b5cf6;"></i>
        </div>

        <div style="
            display: inline-block;
            background: rgba(139,92,246,0.1);
            color: #8b5cf6;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(139,92,246,0.2);
        ">Account Setup</div>

        <h2 style="margin: 0 0 12px; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px;">
            Welcome, {{ username }}!
        </h2>
        <p style="color: var(--text-muted); font-size: 14px; margin: 0 0 28px; line-height: 1.7;">
            Please set a new password for your account.<br>You'll use this to log in going forward.
        </p>           

        <form method="POST" id="setPasswordForm" style="text-align:left;">
            {% csrf_token %}

            <div class="form-group">
                <label>New Password</label>
                <div class="pw-wrap">
                    <input type="password" name="password1" id="pw-input" class="form-input"
                           placeholder="Minimum 8 characters" required autocomplete="new-password"
                           oninput="updateStrength(this.value)">
                    <button type="button" class="pw-eye" onclick="togglePw('pw-input', 'eye1')" tabindex="-1">
                        <i class='bx bx-hide' id="eye1"></i>
                    </button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-label" id="strength-label" style="color:var(--text-dim);">Enter a password to check strength</div>
            </div>

            <div class="form-group" style="margin-bottom:24px;">
                <label>Confirm Password</label>
                <div class="pw-wrap">
                    <input type="password" name="password2" id="pw-confirm" class="form-input"
                           placeholder="Re-enter password" required autocomplete="new-password">
                    <button type="button" class="pw-eye" onclick="togglePw('pw-confirm', 'eye2')" tabindex="-1">
                        <i class='bx bx-hide' id="eye2"></i>
                    </button>
                </div>
            </div>

            <button type="submit" style="
                width: 100%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                background: var(--purple, #8b5cf6);
                color: #fff;
                padding: 13px 30px;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 700;
                text-decoration: none;
                border: none;
                cursor: pointer;
                transition: opacity 0.2s;
            " onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
                <i class='bx bx-check-shield'></i>
                Activate My Account
            </button>
        </form>

        <!-- Divider -->
        <div style="margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border);">
            <p style="margin: 0; font-size: 12px; color: var(--text-muted); opacity: 0.6;">
                <i class='bx bx-lock-alt' style="vertical-align: middle; margin-right: 4px;"></i>
                CraveCast Security — Automated Staff Access Control
            </p>
        </div>

    </div>

    <script>
    function togglePw(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bx bx-show';
        } else {
            input.type = 'password';
            icon.className = 'bx bx-hide';
        }
    }

    function updateStrength(pw) {
        const fill  = document.getElementById('strength-fill');
        const label = document.getElementById('strength-label');
        let score = 0;
        if (pw.length >= 8)            score++;
        if (pw.length >= 12)           score++;
        if (/[A-Z]/.test(pw))         score++;
        if (/[0-9]/.test(pw))         score++;
        if (/[^A-Za-z0-9]/.test(pw))  score++;
        const levels = [
            { pct: '0%',   color: 'var(--text-dim)',  text: 'Enter a password to check strength' },
            { pct: '20%',  color: 'var(--red)',       text: 'Very weak' },
            { pct: '40%',  color: 'var(--amber)',     text: 'Weak — add uppercase & numbers' },
            { pct: '60%',  color: 'var(--amber)',     text: 'Fair' },
            { pct: '80%',  color: 'var(--blue)',      text: 'Strong' },
            { pct: '100%', color: 'var(--green)',     text: '✓ Very strong' },
        ];
        const l = levels[pw.length ? score : 0];
        fill.style.width      = l.pct;
        fill.style.background = l.color;
        label.textContent     = l.text;
        label.style.color     = l.color;
    }

    document.getElementById('setPasswordForm').addEventListener('submit', function(e) {
        const pw  = document.getElementById('pw-input').value;
        const cpw = document.getElementById('pw-confirm').value;
        if (pw !== cpw) {
            e.preventDefault();
            const c = document.getElementById('pw-confirm');
            c.style.borderColor = 'var(--red)';
            c.setCustomValidity('Passwords do not match.');
            c.reportValidity();
        } else {
            document.getElementById('pw-confirm').setCustomValidity('');
        }
    });
    document.getElementById('pw-confirm').addEventListener('input', function() {
        this.style.borderColor = '';
        this.setCustomValidity('');
    });
    </script>
</body>
</html>
