{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveCast — Sign In</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
    :root[data-theme="dark"] {
        --bg:           #06060a;
        --surface:      #0c0c16;
        --surface2:     #121222;
        --surface3:     #1a1a30;
        --border:       rgba(255,255,255,0.06);
        --border-focus: rgba(255,61,90,0.4);
        --text:         #f0f0f8;
        --text-muted:   #8a92a6;
        --text-dim:     #4f5866;
        --panel-blend:  #090911;
        --logo-filter:  invert(1) brightness(2);
        --glass-bg:     rgba(255, 255, 255, 0.02);
        --glass-border: rgba(255, 255, 255, 0.05);
    }

    :root[data-theme="light"] {
        --bg:           #f4f5fa;
        --surface:      #ffffff;
        --surface2:     #f0f2f8;
        --surface3:     #e4e7f2;
        --border:       rgba(0,0,0,0.07);
        --border-focus: rgba(255,61,90,0.4);
        --text:         #111625;
        --text-muted:   #6b7280;
        --text-dim:     #9ca3af;
        --panel-blend:  #0f1424;
        --logo-filter:  none;
        --glass-bg:     rgba(15, 20, 36, 0.03);
        --glass-border: rgba(15, 20, 36, 0.08);
    }

    :root {
        --red:         #ff3d5a;
        --red-dim:     rgba(255,61,90,0.1);
        --red-glow:    rgba(255,61,90,0.3);
        --purple-glow: rgba(139, 92, 246, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        transition: background 0.3s, color 0.3s;
    }

    /* ── LEFT PANEL: Tech-Vibe Glassmorphism Showcase ── */
    .left-panel {
        background: var(--panel-blend);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 64px;
        position: relative;
        border-right: 1px solid var(--border);
        overflow: hidden;
    }

    /* Moving Tech Orbs Background Effects */
    .left-panel::before {
        content: '';
        position: absolute;
        width: 450px;
        height: 450px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
        top: -10%;
        left: -10%;
        animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .left-panel::after {
        content: '';
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
        bottom: -15%;
        right: -10%;
        animation: floatOrb 15s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatOrb {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(40px) scale(1.1); }
    }

    /* Frosted Glass Branding Card Cluster */
    .glass-brand-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 48px 64px;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 10;
        animation: cardFadeIn 0.6s ease;
    }

    @keyframes cardFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo-img {
        width: 90px;
        height: 90px;
        object-fit: contain;
        filter: var(--logo-filter);
        transition: filter 0.3s ease;
    }

    .brand-name {
        font-family: 'Syne', sans-serif;
        font-size: 36px;
        font-weight: 800;
        color: #f0f0f8;
        letter-spacing: -1px;
    }
    .brand-name span { color: var(--red); }

    .brand-badge {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-muted);
        opacity: 0.8;
        border-top: 1px solid var(--border);
        padding-top: 12px;
        width: 100%;
        text-align: center;
    }

    /* ── RIGHT PANEL: Clean Access Terminal ── */
    .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 64px;
        background: var(--surface);
        transition: background 0.3s;
        position: relative;
    }

    .top-right-controls {
        position: absolute;
        top: 24px; right: 24px;
        display: flex;
        gap: 8px;
    }

    .theme-toggle-btn {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: var(--surface2);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 18px;
        transition: all 0.2s;
    }
    .theme-toggle-btn:hover { color: var(--text); border-color: var(--border-focus); }

    .lang-toggle-btn {
        height: 36px;
        padding: 0 12px;
        border-radius: 10px;
        background: var(--surface2);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        font-family: 'Syne', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: all 0.2s;
    }
    .lang-toggle-btn:hover { color: var(--text); border-color: var(--border-focus); }

    .login-card { width: 100%; max-width: 380px; }

    .login-heading {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
    }

    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }

    .role-selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
    }
    .role-option { display: none; }
    .role-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
    }
    .role-label i { font-size: 16px; }
    .role-option:checked + .role-label {
        border-color: var(--red);
        background: var(--red-dim);
        color: var(--red);
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .input-wrap { position: relative; }
    .input-wrap > i {
        position: absolute;
        left: 14px; top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 18px;
    }
    .input-wrap input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        transition: all 0.2s;
    }
    .input-wrap input:focus { outline: none; border-color: var(--red); background: var(--surface3); }

    .input-wrap input.has-toggle { padding-right: 42px; }
    .toggle-pw-btn {
        position: absolute;
        right: 12px; top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        padding: 4px;
        color: var(--text-dim);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition: color 0.2s;
    }
    .toggle-pw-btn:hover { color: var(--text-muted); }

    /* ── Recovery Link Styles ── */
    .forgot-link-wrapper {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
    }
    .forgot-link {
        font-size: 12px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }
    .forgot-link:hover {
        color: var(--red);
    }

    .btn-login {
        width: 100%;
        padding: 14px;
        background: var(--red);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-family: 'Syne', sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 28px;
    }
    .btn-login:hover { background: #e0304a; transform: translateY(-1px); box-shadow: 0 4px 20px var(--red-glow); }

    .msg-error {
        padding: 12px 16px;
        background: var(--red-dim);
        border: 1px solid rgba(255,61,90,0.2);
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--red);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0 0;
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .security-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 20px;
        font-size: 11px;
        color: var(--text-dim);
    }
    .security-note i { color: var(--red); }

    @media (max-width: 850px) {
        body { grid-template-columns: 1fr; }
        .left-panel { display: none; }
        .right-panel { padding: 32px 24px; }
    }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="glass-brand-card">
        <img src="{% static 'images/logo.png' %}" alt="CraveCast Corporate Logo" class="brand-logo-img">
        <div class="brand-name">Crave<span>Cast</span></div>
        <div class="brand-badge">Demand Forecasting System</div>
    </div>
</div>

<div class="right-panel">

    <div class="top-right-controls">
        <button type="button" class="lang-toggle-btn" id="lang-toggle" title="Switch language / Palitan ang wika">
            <span id="lang-label">EN</span>
        </button>
        <div class="theme-toggle-btn" id="theme-toggle" title="Toggle UI Theme Mode">
            <i class='bx bx-moon' id="theme-icon"></i>
        </div>
    </div>

    <div class="login-card">
        <div class="login-heading" data-en="Welcome" data-tl="Maligayang Pagdating">Welcome</div>
        <div class="login-sub" data-en="Sign in to your account" data-tl="Mag-sign in sa iyong account">Sign in to your account</div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="role-selector">
                <input type="radio" name="role" id="role-staff" value="Staff" class="role-option" checked>
                <label for="role-staff" class="role-label">
                    <i class='bx bx-user'></i> <span data-en="Staff" data-tl="Staff">Staff</span>
                </label>

                <input type="radio" name="role" id="role-owner" value="Owner" class="role-option">
                <label for="role-owner" class="role-label">
                    <i class='bx bx-crown'></i> <span data-en="Owner Portal" data-tl="Portal ng Owner">Owner Portal</span>
                </label>
            </div>

            <div class="form-group">
                <label data-en="Username" data-tl="Username">Username</label>
                <div class="input-wrap">
                    <i class='bx bx-user-circle'></i>
                    <input type="text" name="username" data-en-placeholder="Enter security username" data-tl-placeholder="Ilagay ang iyong username" placeholder="Enter security username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label data-en="Password" data-tl="Password">Password</label>
                <div class="input-wrap">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" name="password" id="login-password" class="has-toggle" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" id="toggle-password" aria-label="Show password" aria-pressed="false" aria-controls="login-password">
                        <i class='bx bx-show'></i>
                    </button>
                </div>
                <!-- Integrated Recovery Node Connection -->
                <div class="forgot-link-wrapper">
                    <a href="{% url 'forgot_password' %}" class="forgot-link" data-en="Forgot Password?" data-tl="Nakalimutan ang Password?">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class='bx bx-log-in-circle'></i> <span data-en="Login" data-tl="Mag-login">Login</span>
            </button>
        </form>
    </div>
</div>

<script>
    const html      = document.documentElement;
    const themeBtn  = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const saved     = localStorage.getItem('cc-theme') || 'dark';
    
    html.setAttribute('data-theme', saved);
    themeIcon.className = saved === 'dark' ? 'bx bx-moon' : 'bx bx-sun';

    themeBtn.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next    = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        themeIcon.className = next === 'dark' ? 'bx bx-moon' : 'bx bx-sun';
        localStorage.setItem('cc-theme', next);
    });

    /* ── Language toggle (EN / TL) ── */
    const langBtn   = document.getElementById('lang-toggle');
    const langLabel = document.getElementById('lang-label');

    function applyLang(lang) {
        document.querySelectorAll('[data-en]').forEach(function (el) {
            el.textContent = lang === 'tl' ? el.getAttribute('data-tl') : el.getAttribute('data-en');
        });
        document.querySelectorAll('[data-en-placeholder]').forEach(function (el) {
            el.setAttribute('placeholder', lang === 'tl'
                ? el.getAttribute('data-tl-placeholder')
                : el.getAttribute('data-en-placeholder'));
        });
        langLabel.textContent = lang === 'tl' ? 'TL' : 'EN';
        document.documentElement.setAttribute('lang', lang === 'tl' ? 'fil' : 'en');
    }

    const savedLang = localStorage.getItem('cc-lang') || 'en';
    applyLang(savedLang);

    langBtn.addEventListener('click', function () {
        const next = (localStorage.getItem('cc-lang') || 'en') === 'en' ? 'tl' : 'en';
        localStorage.setItem('cc-lang', next);
        applyLang(next);
    });

    const pwInput  = document.getElementById('login-password');
    const pwToggle = document.getElementById('toggle-password');
    pwToggle.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        pwToggle.querySelector('i').className = isHidden ? 'bx bx-hide' : 'bx bx-show';
        pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        pwToggle.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
    });
</script>
</body>
</html>
